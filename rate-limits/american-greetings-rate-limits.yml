description: >-
  American Greetings publishes no API rate limits, and its one public API returns no rate-limit
  signal on the wire. This artifact records that against evidence: limit_count is 0 because there
  is nothing published, not because nothing was checked.
notes: >-
  Upgraded 2026-09-02 from a 2026-05-04 bulk-sweep scaffold to a probed record. The company runs no
  developer programme; the only reachable API is the corporate WordPress REST API on WordPress VIP.
  Retail trading-partner integration runs on private EDI under bilateral agreements and has no
  public rate-limit surface.
observed_headers:
  rate_limit_headers: []
  note: >-
    No RateLimit-*, X-RateLimit-* or Retry-After header appeared on any observed response. The
    response headers that ARE returned are pagination and cache diagnostics, not throttling signal.
  present_instead:
    - X-WP-Total
    - X-WP-TotalPages
    - Link
    - Cache-Control
    - X-Cache
    - X-RQ
  evidence: 'GET https://corporate.americangreetings.com/wp-json/wp/v2/posts?per_page=2 -> 200'
responseCodes:
  throttled: null
  serviceUnavailable: null
  note: >-
    No 429 was observed and none is documented. Do not assume 429 is the exhaustion code on this
    API — it has not been demonstrated.
limits: []
policies:
  - name: Documentation Status
    description: >-
      No published per-second, per-minute or per-day limit on any American Greetings surface. The
      corporate site's 20 indexed pages contain no developer or API section.
  - name: Observed Ceilings
    description: >-
      The only enforced ceiling found is a pagination one, declared in the provider's own route
      index: per_page has minimum 1 and maximum 100 on wp/v2 collections. That is a page-size cap,
      not a rate limit.
  - name: Backoff Strategy
    description: >-
      Because no limit is published and no throttling header is returned, a client cannot know when
      it is close to a ceiling. Keep request rates modest, serialise rather than parallelise, and
      apply exponential backoff with jitter on any 429, 503 or edge 403 — the Akamai edge in front
      of the company's other hosts already returns 403 to unfamiliar clients.
sources:
