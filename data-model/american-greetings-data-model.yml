api: American Greetings Corporate WordPress REST API
description: >-
  Entity graph of the American Greetings corporate content API, derived from the response schemas
  the host returns on OPTIONS for each collection. Two of these entities are American Greetings'
  own: Product and Brand are custom post types the company defined, and they carry the corporate
  product-line and brand catalogue. The rest are WordPress platform entities.
identifiers:
  scheme: integer
  note: >-
    Ids are per-site auto-increment integers with no type prefix. They are NOT portable between
    American Greetings brand sites — post 1706 on corporate.americangreetings.com is unrelated to
    post 1706 on carltoncards.ca. Every entity also carries a "slug" (URL-safe string) and a "link"
    (absolute canonical URL), either of which is a safer cross-system key than the integer id.
