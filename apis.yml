description: >-
  American Greetings is a privately held American manufacturer and marketer of social expression
  products — greeting cards, gift packaging, party goods, stationery, stickers and decals, and
  digital greetings — headquartered in Westlake, Ohio, and selling through mass retail, grocery,
  drug and specialty channels in North America and internationally. Its brand portfolio includes
  American Greetings, Papyrus, Carlton Cards, Jacquie Lawson and Blue Mountain. The company
  operates no public developer programme: there is no developer portal, no published API
  documentation, no SDK in any package registry, and no API pricing. The one machine-readable API
  it serves in public is the WordPress REST API on its corporate site, which exposes the company's
  own brand and product-line catalogue as custom post types alongside its press releases and media
  library, readable anonymously.
