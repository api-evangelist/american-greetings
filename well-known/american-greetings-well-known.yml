description: >-
  Named /.well-known/ path probe across every American Greetings host known to this repo. No path
  returned a document on any host. corporate.americangreetings.com (WordPress VIP) answers a real
  404 for every path. api.americangreetings.com and www.americangreetings.com sit behind an Akamai
  edge policy that returns an identical "Access Denied" 403 HTML body to every non-browser client
  for every path, including the site root — the 403 is a blanket bot policy, not a per-path finding,
  so nothing can be concluded about what those hosts do or do not serve at these paths.
  No WellKnown or SecurityTxt pointer is emitted, because no path returned a real document.
notes: >-
